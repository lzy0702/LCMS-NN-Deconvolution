[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lcmsdeconv"
version = "0.1.0"
description = "Neural-network deconvolution, EIC extraction, integration and quantitation for LC-ESI-MS of macromolecules"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "LCMS-NN-Deconvolution contributors"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyteomics>=4.6",
    "lxml>=4.9",
    "psims>=1.3",
    "h5py>=3.8",
    "pyyaml>=6.0",
    "click>=8.1",
    "jinja2>=3.1",
    "matplotlib>=3.7",
    "onnxruntime>=1.16",
]

[project.optional-dependencies]
train = ["torch>=2.1", "onnx>=1.14"]
gui = ["PySide6>=6.5", "pyqtgraph>=0.13"]
accel = ["onnxruntime-openvino; sys_platform != 'darwin'", "onnxruntime-directml; sys_platform == 'win32'"]
fast = ["numba>=0.58"]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.2",
    "hypothesis>=6.80",
    "ruff>=0.4",
    "mypy>=1.5",
]

[project.scripts]
lcmsdeconv = "lcmsdeconv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lcmsdeconv = ["models/*.onnx", "models/*.json", "report/templates/*.j2", "configs/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501", "B008", "B905", "UP007", "UP035", "UP006", "NPY002", "NPY201"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
